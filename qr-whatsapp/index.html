<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f3efe6">
  <title>Abriendo WhatsApp · Germán Guarino</title>
  <style>
    :root{color-scheme:light;--paper:#f3efe6;--ivory:#fbf9f4;--ink:#18211b;--muted:#64675f;--line:#d9d4c8;--green:#264d3a;--terra:#b85c3d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);padding:48px 36px;text-align:center;background:var(--ivory);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(24,33,27,.08)}
    .mark{width:54px;height:54px;margin:0 auto 25px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:500 30px/1 Georgia,serif}
    .eyebrow{margin:0 0 12px;color:var(--terra);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
    h1{margin:0 0 14px;font:500 clamp(30px,8vw,42px)/1.08 Georgia,serif}p{color:var(--muted);margin:0 0 24px}
    a{min-height:50px;padding:12px 22px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--green);color:#fff;text-decoration:none;font-weight:650}a:focus-visible{outline:3px solid #1677c8;outline-offset:4px}
    .note{font-size:12px;margin:18px 0 0}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
  <script>
    window.dataLayer = window.dataLayer || [];
    const whatsappTarget = 'https://wa.me/5491159539389';
    let redirected = false;
    const continueToWhatsApp = () => {
      if (redirected) return;
      redirected = true;
      window.location.replace(whatsappTarget);
    };
    window.dataLayer.push({
      event: 'qr_whatsapp_scan',
      contact_channel: 'printed_qr',
      eventCallback: continueToWhatsApp,
      eventTimeout: 1800
    });
    window.setTimeout(continueToWhatsApp, 2200);
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">G</div>
    <p class="eyebrow">Lic. Germán Guarino · Psicólogo</p>
    <h1>Abriendo WhatsApp</h1>
    <p>En un instante vas a poder escribir para consultar por una entrevista.</p>
    <a href="https://wa.me/5491159539389">Continuar a WhatsApp</a>
    <p class="note">Si no se abre automáticamente, tocá el botón.</p>
  </main>
</body>
</html>
